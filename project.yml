name: DSStore

options:
  bundleIdPrefix: dev.ettlin.nicolas
  deploymentTarget:
    # iPhone Duo's hinge APIs.
    iOS: "27.1"
  createIntermediateGroups: true

projectReferences:
  MelonDSDeltaCore:
    path: Vendor/MelonDSDeltaCore/MelonDSDeltaCore.xcodeproj
  DeltaCore:
    path: Vendor/DeltaCore/DeltaCore.xcodeproj
  ZIPFoundation:
    path: Vendor/DeltaCore/External/ZIPFoundation/ZIPFoundation.xcodeproj

settings:
  base:
    SWIFT_VERSION: "6.0"
    # melonDS' ARM64 JIT linkage is assembly that only builds for arm64.
    EXCLUDED_ARCHS[sdk=iphonesimulator*]: x86_64

targets:
  DSStore:
    type: application
    platform: iOS
    sources:
      - App
    dependencies:
      - target: MelonDSDeltaCore/MelonDSDeltaCore
      - target: DeltaCore/DeltaCore
      - target: ZIPFoundation/ZIPFoundation
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: DS
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIStatusBarHidden: true
        NSMicrophoneUsageDescription: Some games ask you to blow or speak into the microphone.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.ettlin.nicolas.dsstore
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        SWIFT_APPROACHABLE_CONCURRENCY: YES
    postBuildScripts:
      - name: Bundle ROMs
        basedOnDependencyAnalysis: false
        script: |
          # Copies each ROM/<id>.nds, or the .nds inside ROM/<id>.zip, to Games/<id>.nds (symlinks are followed).
          # Unchanged games aren't copied again, and games no longer in ROM/ are removed.
          DEST="${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/Games"
          mkdir -p "$DEST"
          shopt -s nullglob
          for rom in "$DEST"/*.nds; do
            id=$(basename "$rom" .nds)
            [ -e "${SRCROOT}/ROM/$id.nds" ] || [ -e "${SRCROOT}/ROM/$id.zip" ] || rm -f "$rom"
          done
          found=0
          for src in "${SRCROOT}"/ROM/*.nds "${SRCROOT}"/ROM/*.zip; do
            found=1
            id=$(basename "${src%.*}")
            out="$DEST/$id.nds"
            [ "$out" -nt "$src" ] && continue
            case "$src" in
              *.nds) cp -L "$src" "$out" ;;
              *.zip) unzip -p "$src" '*.nds' > "$out" ;;
            esac
          done
          [ $found = 1 ] || echo "warning: No ROMs found in ROM/; every game will be unavailable."
