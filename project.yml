name: DSStore

options:
  bundleIdPrefix: dev.ettlin.nicolas
  deploymentTarget:
    # iPhone Duo's hinge APIs.
    iOS: "27.1"
  createIntermediateGroups: true

projectReferences:
  MelonDSDeltaCore:
    path: Vendor/MelonDSDeltaCore/MelonDSDeltaCore.xcodeproj
  DeltaCore:
    path: Vendor/DeltaCore/DeltaCore.xcodeproj
  ZIPFoundation:
    path: Vendor/DeltaCore/External/ZIPFoundation/ZIPFoundation.xcodeproj

settings:
  base:
    SWIFT_VERSION: "6.0"
    # melonDS' ARM64 JIT linkage is assembly that only builds for arm64.
    EXCLUDED_ARCHS[sdk=iphonesimulator*]: x86_64

targets:
  DSStore:
    type: application
    platform: iOS
    sources:
      - App
    dependencies:
      - target: MelonDSDeltaCore/MelonDSDeltaCore
      - target: DeltaCore/DeltaCore
      - target: ZIPFoundation/ZIPFoundation
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: DS
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIStatusBarHidden: true
        NSMicrophoneUsageDescription: Some games ask you to blow or speak into the microphone.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.ettlin.nicolas.dsstore
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        SWIFT_APPROACHABLE_CONCURRENCY: YES
    postBuildScripts:
      - name: Bundle ROM
        basedOnDependencyAnalysis: false
        script: |
          # Copies ROM/game.nds, or the .nds inside ROM/game.zip, into the app bundle (symlinks are followed).
          NDS="${SRCROOT}/ROM/game.nds"
          ZIP="${SRCROOT}/ROM/game.zip"
          DEST="${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/game.nds"
          if [ -e "$NDS" ]; then
            cp -L "$NDS" "$DEST"
          elif [ -e "$ZIP" ]; then
            unzip -p "$ZIP" '*.nds' > "$DEST"
          else
            echo "warning: No ROM found at ROM/game.nds or ROM/game.zip; the app will show a placeholder."
            rm -f "$DEST"
          fi
